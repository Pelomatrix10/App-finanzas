<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Mis Finanzas — Estudio</title>
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<meta name="theme-color" content="#17140f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mis Finanzas">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Anton&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#17140f; --ink-2:#201c15; --paper:#f2ead9; --paper-dim:#cbc0a8;
  --brass:#c69a52; --brass-soft:rgba(198,154,82,.16);
  --moss:#8a9a7e; --moss-bg:rgba(138,154,126,.14);
  --terracotta:#b5602f; --terracotta-bg:rgba(181,96,47,.16);
  --oxide:#a23c26; --oxide-bg:rgba(162,60,38,.18);
  --line:rgba(242,234,217,.14);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--ink);color:var(--paper)}
body{font-family:'Inter',sans-serif;display:flex;justify-content:center}
button,input,select{font:inherit}
.app{
  width:100%;max-width:460px;min-height:100vh;display:flex;flex-direction:column;
  background:radial-gradient(1200px 400px at 50% -10%,rgba(198,154,82,.10),transparent),var(--ink);
}
header{padding:30px 22px 16px;border-bottom:1px solid var(--line);padding-top:max(30px,env(safe-area-inset-top))}
.eyebrow{font-family:'Bebas Neue',sans-serif;font-size:14px;letter-spacing:.16em;text-transform:uppercase;color:var(--brass);margin-bottom:6px;display:flex;align-items:center;gap:8px}
.eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--brass)}
header h1{font-family:'Anton',sans-serif;font-weight:400;font-size:32px;margin:0 0 6px;letter-spacing:-.01em;text-transform:uppercase;line-height:.95}
header p.sub{margin:0;font-size:13px;color:var(--paper-dim);line-height:1.5}
nav.tabs{display:flex;padding:0 8px;border-bottom:1px solid var(--line);gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:1;min-width:74px;background:none;border:none;color:var(--paper-dim);font-family:'Bebas Neue',sans-serif;font-size:14px;letter-spacing:.05em;text-transform:uppercase;padding:14px 4px 11px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
nav.tabs button.active{color:var(--paper);border-color:var(--brass)}
main{padding:20px 18px 80px;flex:1}
section{display:none}.active-section{display:block}
.narrativa{font-weight:500;font-size:15px;line-height:1.6;padding:16px 4px 20px;border-bottom:1px solid var(--line);margin-bottom:18px}
.narrativa .num{font-family:'Bebas Neue',sans-serif;font-size:1.25em;letter-spacing:.03em;color:var(--brass)}
.narrativa .num.pend{color:var(--terracotta)} .narrativa .num.debe{color:var(--oxide)}
.btn{font-family:'Bebas Neue',sans-serif;font-size:15px;letter-spacing:.03em;border-radius:9px;padding:11px 16px;border:1px solid transparent;cursor:pointer}
.btn-brass{background:var(--brass);color:var(--ink)}
.btn-ghost{background:transparent;color:var(--paper);border-color:var(--line)}
.btn-danger{background:transparent;color:#d46a53;border-color:rgba(212,106,83,.35)}
.btn-sm{padding:8px 12px;font-size:13px;border-radius:7px}
.btn-block{width:100%}
.add-row{display:flex;justify-content:flex-end;margin-bottom:16px}
.mini-form{margin-top:14px;display:grid;gap:8px}
.mini-form input,.mini-form select{width:100%;background:var(--ink);border:1px solid var(--line);color:var(--paper);padding:10px 12px;border-radius:8px;font-size:13.5px}
.mini-form-row{display:flex;gap:8px}
.filmstrip{position:relative}
.frame{position:relative;background:var(--ink-2);border:1px solid var(--line);border-radius:4px;margin-bottom:14px;padding:16px 16px 16px 22px;overflow:hidden}
.frame::before,.frame::after{content:'';position:absolute;left:0;top:0;bottom:0;width:8px;background-image:radial-gradient(circle,var(--ink) 2.2px,transparent 2.3px);background-size:8px 14px;background-position:0 4px;opacity:.9}
.frame::after{left:auto;right:0}
.frame-top{display:flex;align-items:center;gap:12px;cursor:pointer}
.iris{width:44px;height:44px;border-radius:50%;flex:none;background:conic-gradient(from 0deg,var(--brass) 0 40deg,transparent 40deg 45deg,var(--brass) 45deg 85deg,transparent 85deg 90deg,var(--brass) 90deg 130deg,transparent 130deg 135deg,var(--brass) 135deg 175deg,transparent 175deg 180deg,var(--brass) 180deg 220deg,transparent 220deg 225deg,var(--brass) 225deg 265deg,transparent 265deg 270deg,var(--brass) 270deg 310deg,transparent 310deg 315deg,var(--brass) 315deg 355deg,transparent 355deg 360deg);display:flex;align-items:center;justify-content:center}
.iris.oxide{filter:hue-rotate(310deg) saturate(.8)}
.iris span{width:26px;height:26px;border-radius:50%;background:var(--ink-2);display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:15px}
.frame-id{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.08em;color:var(--paper-dim);margin-bottom:2px}
.frame-name{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:.02em}
.frame-meta{font-size:12px;color:var(--paper-dim);margin-top:2px}
.frame-right{margin-left:auto;text-align:right}
.estado-pill{font-family:'Bebas Neue',sans-serif;font-size:13px;letter-spacing:.03em;padding:4px 10px;border-radius:20px;display:inline-block;white-space:nowrap}
.estado-al-dia{background:var(--moss-bg);color:var(--moss)}
.estado-pendiente{background:var(--terracotta-bg);color:var(--terracotta)}
.estado-debe{background:var(--oxide-bg);color:var(--oxide)}
.frame-detail{margin-top:14px;padding-top:14px;border-top:1px dashed var(--line);display:none}
.frame.open .frame-detail{display:block}
.notes{margin-top:8px;font-size:12.5px;color:var(--paper-dim);font-style:italic}
.detail-row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}
.detail-row .concepto{font-weight:600}.detail-row .fecha{font-size:11px;color:var(--paper-dim);font-family:'IBM Plex Mono',monospace}
.monto{font-family:'IBM Plex Mono',monospace;font-weight:600}
.monto.pagado{color:var(--moss)}.monto.pendiente{color:var(--terracotta)}.monto.debe{color:var(--oxide)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.link-btn{background:none;border:none;padding:0;color:var(--paper-dim);font-size:11px;text-decoration:underline;cursor:pointer}
.link-btn.danger{color:#d46a53}
.cobro-row{background:var(--ink-2);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.cobro-left .cliente{font-family:'Bebas Neue',sans-serif;font-size:19px}.cobro-left .concepto{font-size:12.5px;color:var(--paper-dim);margin-top:2px}
.cobro-mid{text-align:center}.timecode{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:13px;padding:4px 9px;border-radius:6px}
.tc-fresh{background:var(--brass-soft);color:var(--brass)}.tc-warn{background:var(--terracotta-bg);color:var(--terracotta)}.tc-hot{background:var(--oxide-bg);color:var(--oxide)}
.cobro-right{display:flex;flex-direction:column;gap:6px;align-items:flex-end}.cobro-monto{font-family:'Bebas Neue',sans-serif;font-size:19px}
.section-title{font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:.06em;text-transform:uppercase;color:var(--paper-dim);margin:22px 2px 10px}
.stat-grid{display:flex;gap:8px;margin-bottom:22px;flex-wrap:wrap}.stat{flex:1;min-width:100px;background:var(--ink-2);border:1px solid var(--line);border-radius:10px;padding:14px;text-align:center}
.stat .label{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--paper-dim);margin-bottom:6px}.stat .value{font-family:'Anton',sans-serif;font-size:18px}
.value.moss{color:var(--moss)}.value.brass{color:var(--brass)}.value.terracotta{color:var(--terracotta)}.value.oxide{color:var(--oxide)}
.breakdown-title{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--paper-dim);margin:0 0 10px 2px}
.empty{color:var(--paper-dim);font-size:13px;text-align:center;padding:30px 0;font-style:italic}
.equipo-row{background:var(--ink-2);border:1px solid var(--line);border-radius:10px;padding:13px 16px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.equipo-row .nombre{font-weight:600;font-size:14.5px}.equipo-row .fecha{font-size:11px;color:var(--paper-dim);margin-top:2px}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="eyebrow"><span class="dot"></span> Mis Finanzas</div>
  <h1>Todo tu estudio</h1>
  <p class="sub">Quién te debe, a quién le debes, y cuánto tienes invertido.</p>
</header>

<nav class="tabs">
  <button class="tab-btn active" data-tab="clientes">Clientes</button>
  <button class="tab-btn" data-tab="colaboradores">Equipo</button>
  <button class="tab-btn" data-tab="cobros">Pagos</button>
  <button class="tab-btn" data-tab="equipo">Gear</button>
  <button class="tab-btn" data-tab="resumen">Resumen</button>
</nav>

<main>
<section id="tab-clientes" class="active-section">
  <div class="narrativa" id="narrativa-clientes"></div>
  <div class="add-row"><button class="btn btn-brass btn-sm" id="btn-nuevo-cliente">+ Nuevo cliente</button></div>
  <div class="mini-form" id="form-nuevo-cliente" style="display:none;margin-bottom:18px">
    <input type="text" id="nc-nombre" placeholder="Nombre del cliente">
    <input type="text" id="nc-nota" placeholder="Nota (opcional)">
    <div class="mini-form-row"><button class="btn btn-brass btn-block btn-sm" onclick="guardarCliente()">Guardar</button><button class="btn btn-ghost btn-block btn-sm" onclick="toggleFormCliente(false)">Cancelar</button></div>
  </div>
  <div class="filmstrip" id="lista-clientes"></div>
</section>

<section id="tab-colaboradores">
  <div class="narrativa" id="narrativa-colaboradores"></div>
  <div class="add-row"><button class="btn btn-brass btn-sm" id="btn-nuevo-colab">+ Nuevo colaborador</button></div>
  <div class="mini-form" id="form-nuevo-colab" style="display:none;margin-bottom:18px">
    <input type="text" id="col-nombre" placeholder="Nombre">
    <input type="text" id="col-rol" placeholder="Rol (Editor, Asistente...)">
    <div class="mini-form-row"><button class="btn btn-brass btn-block btn-sm" onclick="guardarColaborador()">Guardar</button><button class="btn btn-ghost btn-block btn-sm" onclick="toggleFormColab(false)">Cancelar</button></div>
  </div>
  <div class="filmstrip" id="lista-colaboradores"></div>
</section>

<section id="tab-cobros">
  <div class="narrativa" id="narrativa-cobros"></div>
  <div class="section-title">Te deben</div><div id="lista-cobros"></div>
  <div class="section-title">Debes</div><div id="lista-pagos"></div>
</section>

<section id="tab-equipo">
  <div class="narrativa" id="narrativa-equipo"></div>
  <div class="add-row"><button class="btn btn-brass btn-sm" id="btn-nuevo-equipo">+ Nuevo equipo</button></div>
  <div class="mini-form" id="form-nuevo-equipo" style="display:none;margin-bottom:18px">
    <input type="text" id="eq-nombre" placeholder="Nombre (ej. Sony A7IV)">
    <select id="eq-categoria"><option>Cámaras</option><option>Lentes</option><option>Iluminación</option><option>Audio</option><option>Otros</option></select>
    <input type="number" id="eq-monto" placeholder="Monto invertido (S/)">
    <div class="mini-form-row"><button class="btn btn-brass btn-block btn-sm" onclick="guardarEquipo()">Guardar</button><button class="btn btn-ghost btn-block btn-sm" onclick="toggleFormEquipo(false)">Cancelar</button></div>
  </div>
  <div id="lista-equipo"></div>
</section>

<section id="tab-resumen">
  <div class="narrativa" id="narrativa-resumen"></div>
  <div class="stat-grid">
    <div class="stat"><div class="label">Cobrado / mes</div><div class="value moss" id="st-cobrado">S/ 0</div></div>
    <div class="stat"><div class="label">Te deben</div><div class="value terracotta" id="st-pendiente">S/ 0</div></div>
    <div class="stat"><div class="label">Debes</div><div class="value oxide" id="st-debes">S/ 0</div></div>
    <div class="stat"><div class="label">En equipo</div><div class="value brass" id="st-equipo">S/ 0</div></div>
  </div>
  <div class="breakdown-title">Por cliente</div><div id="lista-breakdown"></div>
</section>
</main>
</div>

<script>
const STORAGE_KEY='estudio_app_completa_v1';

function emptyData(){return {clientes:[],colaboradores:[],equipo:[]}}
let saved=null;
try{saved=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null')}catch(e){}
let data=saved||emptyData();
let clientes=Array.isArray(data.clientes)?data.clientes:[];
let colaboradores=Array.isArray(data.colaboradores)?data.colaboradores:[];
let equipo=Array.isArray(data.equipo)?data.equipo:[];

function guardar(){localStorage.setItem(STORAGE_KEY,JSON.stringify({clientes,colaboradores,equipo}))}
function nextId(arr){return Math.max(0,...arr.map(x=>Number(x.id)||0))+1}
let nextClienteId=nextId(clientes);
let nextProyectoId=nextId(clientes.flatMap(c=>c.proyectos||[]));
let nextColabId=nextId(colaboradores);
let nextPagoId=nextId(colaboradores.flatMap(c=>c.pagos||[]));
let nextEquipoId=nextId(equipo);

const fmt=n=>'S/ '+Number(n||0).toLocaleString('es-PE',{maximumFractionDigits:2});
const hoy=()=>new Date().toISOString().slice(0,10);
const mesActual=()=>hoy().slice(0,7);
function diasDesde(f){return Math.max(0,Math.floor((new Date(hoy())-new Date(f))/86400000))}
function iniciales(n){return String(n||'').split(' ').filter(Boolean).map(w=>w[0]).slice(0,2).join('').toUpperCase()}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}

document.querySelectorAll('.tab-btn').forEach(btn=>btn.addEventListener('click',()=>{
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('main>section').forEach(s=>s.classList.remove('active-section'));
  btn.classList.add('active');document.getElementById('tab-'+btn.dataset.tab).classList.add('active-section');renderAll();
}));

function totalPendiente(c){return (c.proyectos||[]).filter(p=>p.estado==='pendiente').reduce((s,p)=>s+Number(p.monto||0),0)}
function totalFacturado(c){return (c.proyectos||[]).reduce((s,p)=>s+Number(p.monto||0),0)}
function totalDebo(c){return (c.pagos||[]).filter(p=>p.estado==='pendiente').reduce((s,p)=>s+Number(p.monto||0),0)}
function totalPagadoA(c){return (c.pagos||[]).filter(p=>p.estado==='pagado').reduce((s,p)=>s+Number(p.monto||0),0)}
function totalEquipoInvertido(){return equipo.reduce((s,e)=>s+Number(e.monto||0),0)}
function todosLosPendientes(){const out=[];clientes.forEach(c=>(c.proyectos||[]).forEach(p=>{if(p.estado==='pendiente')out.push({cliente:c,proyecto:p})}));return out.sort((a,b)=>diasDesde(b.proyecto.fecha)-diasDesde(a.proyecto.fecha))}
function todosLosPagosPendientes(){const out=[];colaboradores.forEach(c=>(c.pagos||[]).forEach(p=>{if(p.estado==='pendiente')out.push({colaborador:c,pago:p})}));return out.sort((a,b)=>diasDesde(b.pago.fecha)-diasDesde(a.pago.fecha))}

function confirmDel(txt){return confirm(txt)}
function promptText(label,current=''){const v=prompt(label,current);return v===null?null:v.trim()}
function promptAmount(label,current=''){const v=prompt(label,String(current));if(v===null)return null;const n=parseFloat(v.replace(',','.'));if(!Number.isFinite(n)||n<=0){alert('Ingresa un monto válido.');return null}return n}
function promptEstado(current){const v=prompt('Estado: escribe pendiente o pagado',current);if(v===null)return null;const e=v.trim().toLowerCase();if(!['pendiente','pagado'].includes(e)){alert('Estado inválido.');return null}return e}

function toggleFormCliente(show){document.getElementById('form-nuevo-cliente').style.display=show?'grid':'none'}
document.getElementById('btn-nuevo-cliente').onclick=()=>toggleFormCliente(true);
function guardarCliente(){
  const nombre=document.getElementById('nc-nombre').value.trim(),nota=document.getElementById('nc-nota').value.trim();
  if(!nombre)return alert('Ponle un nombre al cliente.');
  clientes.push({id:nextClienteId++,nombre,nota,proyectos:[]});guardar();document.getElementById('nc-nombre').value='';document.getElementById('nc-nota').value='';toggleFormCliente(false);renderAll();
}
function editarCliente(id){const c=clientes.find(x=>x.id===id);if(!c)return;const n=promptText('Nombre del cliente',c.nombre);if(n===null||!n)return;const nota=promptText('Nota',c.nota||'');if(nota===null)return;c.nombre=n;c.nota=nota;guardar();renderAll()}
function eliminarCliente(id){const c=clientes.find(x=>x.id===id);if(!c)return;if(confirmDel(`¿Eliminar a ${c.nombre} y todos sus proyectos?`)){clientes=clientes.filter(x=>x.id!==id);guardar();renderAll()}}
function toggleFrame(id){document.getElementById('frame-'+id)?.classList.toggle('open')}
function mostrarFormProyecto(id){const el=document.getElementById('form-proy-'+id);el.style.display=el.style.display==='grid'?'none':'grid'}
function guardarProyecto(cid){const c=clientes.find(x=>x.id===cid);const concepto=document.getElementById(`pr-concepto-${cid}`).value.trim();const monto=parseFloat(document.getElementById(`pr-monto-${cid}`).value);const estado=document.getElementById(`pr-estado-${cid}`).value;if(!concepto||!monto)return alert('Completa concepto y monto.');c.proyectos=c.proyectos||[];c.proyectos.unshift({id:nextProyectoId++,concepto,monto,estado,fecha:hoy()});guardar();renderAll()}
function editarProyecto(cid,pid){const c=clientes.find(x=>x.id===cid),p=c?.proyectos?.find(x=>x.id===pid);if(!p)return;const concepto=promptText('Concepto',p.concepto);if(concepto===null||!concepto)return;const monto=promptAmount('Monto (S/)',p.monto);if(monto===null)return;const estado=promptEstado(p.estado);if(estado===null)return;p.concepto=concepto;p.monto=monto;p.estado=estado;guardar();renderAll()}
function eliminarProyecto(cid,pid){const c=clientes.find(x=>x.id===cid),p=c?.proyectos?.find(x=>x.id===pid);if(!p)return;if(confirmDel(`¿Eliminar el proyecto “${p.concepto}”?`)){c.proyectos=c.proyectos.filter(x=>x.id!==pid);guardar();renderAll()}}
function marcarCobrado(cid,pid){const p=clientes.find(x=>x.id===cid)?.proyectos?.find(x=>x.id===pid);if(!p)return;p.estado='pagado';p.fecha=hoy();guardar();renderAll()}

function toggleFormColab(show){document.getElementById('form-nuevo-colab').style.display=show?'grid':'none'}
document.getElementById('btn-nuevo-colab').onclick=()=>toggleFormColab(true);
function guardarColaborador(){const n=document.getElementById('col-nombre').value.trim(),r=document.getElementById('col-rol').value.trim();if(!n)return alert('Ponle un nombre al colaborador.');colaboradores.push({id:nextColabId++,nombre:n,rol:r,pagos:[]});guardar();document.getElementById('col-nombre').value='';document.getElementById('col-rol').value='';toggleFormColab(false);renderAll()}
function editarColaborador(id){const c=colaboradores.find(x=>x.id===id);if(!c)return;const n=promptText('Nombre',c.nombre);if(n===null||!n)return;const r=promptText('Rol',c.rol||'');if(r===null)return;c.nombre=n;c.rol=r;guardar();renderAll()}
function eliminarColaborador(id){const c=colaboradores.find(x=>x.id===id);if(!c)return;if(confirmDel(`¿Eliminar a ${c.nombre} y todos sus pagos?`)){colaboradores=colaboradores.filter(x=>x.id!==id);guardar();renderAll()}}
function toggleFrameColab(id){document.getElementById('frame-col-'+id)?.classList.toggle('open')}
function mostrarFormPago(id){const el=document.getElementById('form-pago-'+id);el.style.display=el.style.display==='grid'?'none':'grid'}
function guardarPago(cid){const c=colaboradores.find(x=>x.id===cid);const concepto=document.getElementById(`pg-concepto-${cid}`).value.trim();const monto=parseFloat(document.getElementById(`pg-monto-${cid}`).value);const estado=document.getElementById(`pg-estado-${cid}`).value;if(!concepto||!monto)return alert('Completa concepto y monto.');c.pagos=c.pagos||[];c.pagos.unshift({id:nextPagoId++,concepto,monto,estado,fecha:hoy()});guardar();renderAll()}
function editarPago(cid,pid){const c=colaboradores.find(x=>x.id===cid),p=c?.pagos?.find(x=>x.id===pid);if(!p)return;const concepto=promptText('Concepto',p.concepto);if(concepto===null||!concepto)return;const monto=promptAmount('Monto (S/)',p.monto);if(monto===null)return;const estado=promptEstado(p.estado);if(estado===null)return;p.concepto=concepto;p.monto=monto;p.estado=estado;guardar();renderAll()}
function eliminarPago(cid,pid){const c=colaboradores.find(x=>x.id===cid),p=c?.pagos?.find(x=>x.id===pid);if(!p)return;if(confirmDel(`¿Eliminar el pago “${p.concepto}”?`)){c.pagos=c.pagos.filter(x=>x.id!==pid);guardar();renderAll()}}
function marcarPagado(cid,pid){const p=colaboradores.find(x=>x.id===cid)?.pagos?.find(x=>x.id===pid);if(!p)return;p.estado='pagado';p.fecha=hoy();guardar();renderAll()}

function toggleFormEquipo(show){document.getElementById('form-nuevo-equipo').style.display=show?'grid':'none'}
document.getElementById('btn-nuevo-equipo').onclick=()=>toggleFormEquipo(true);
function guardarEquipo(){const nombre=document.getElementById('eq-nombre').value.trim(),categoria=document.getElementById('eq-categoria').value,monto=parseFloat(document.getElementById('eq-monto').value);if(!nombre||!monto)return alert('Completa nombre y monto.');equipo.unshift({id:nextEquipoId++,nombre,categoria,monto,fecha:hoy()});guardar();document.getElementById('eq-nombre').value='';document.getElementById('eq-monto').value='';toggleFormEquipo(false);renderAll()}
function editarEquipo(id){const e=equipo.find(x=>x.id===id);if(!e)return;const n=promptText('Nombre del equipo',e.nombre);if(n===null||!n)return;const c=promptText('Categoría',e.categoria);if(c===null||!c)return;const m=promptAmount('Monto invertido (S/)',e.monto);if(m===null)return;e.nombre=n;e.categoria=c;e.monto=m;guardar();renderAll()}
function eliminarEquipo(id){const e=equipo.find(x=>x.id===id);if(!e)return;if(confirmDel(`¿Eliminar “${e.nombre}”?`)){equipo=equipo.filter(x=>x.id!==id);guardar();renderAll()}}

function renderClientes(){
 const cont=document.getElementById('lista-clientes'),nar=document.getElementById('narrativa-clientes');cont.innerHTML='';
 const deudores=clientes.filter(c=>totalPendiente(c)>0),total=deudores.reduce((s,c)=>s+totalPendiente(c),0);
 nar.innerHTML=!clientes.length?'Todavía no registras clientes. Añade el primero para empezar.':!deudores.length?`Tienes <span class="num">${clientes.length}</span> cliente${clientes.length===1?'':'s'} y nadie te debe nada ahora mismo.`:`${deudores.map(c=>esc(c.nombre)).join(' y ')} te debe${deudores.length===1?'':'n'} <span class="num pend">${fmt(total)}</span>.`;
 if(!clientes.length){cont.innerHTML='<div class="empty">Aquí aparecerán tus clientes.</div>';return}
 clientes.forEach((c,idx)=>{
  c.proyectos=c.proyectos||[];const pend=totalPendiente(c),frame=document.createElement('div');frame.className='frame';frame.id='frame-'+c.id;
  frame.innerHTML=`<div class="frame-top" onclick="toggleFrame(${c.id})"><div class="iris"><span>${esc(iniciales(c.nombre))}</span></div><div><div class="frame-id">N.${String(idx+1).padStart(2,'0')}</div><div class="frame-name">${esc(c.nombre)}</div><div class="frame-meta">${c.proyectos.length} proyecto${c.proyectos.length===1?'':'s'} · facturado ${fmt(totalFacturado(c))}</div></div><div class="frame-right"><span class="estado-pill ${pend?'estado-pendiente':'estado-al-dia'}">${pend?'debe '+fmt(pend):'al día'}</span></div></div>
  <div class="frame-detail"><div class="actions"><button class="link-btn" onclick="editarCliente(${c.id})">editar cliente</button><button class="link-btn danger" onclick="eliminarCliente(${c.id})">eliminar cliente</button></div>${c.nota?`<div class="notes">“${esc(c.nota)}”</div>`:''}
  ${c.proyectos.length?c.proyectos.map(p=>`<div class="detail-row"><div><div class="concepto">${esc(p.concepto)}</div><div class="fecha">${esc(p.fecha)}</div></div><div style="text-align:right"><div class="monto ${p.estado}">${fmt(p.monto)}</div>${p.estado==='pendiente'?`<button class="link-btn" onclick="marcarCobrado(${c.id},${p.id})">marcar cobrado</button>`:''}<div class="actions" style="justify-content:flex-end"><button class="link-btn" onclick="editarProyecto(${c.id},${p.id})">editar</button><button class="link-btn danger" onclick="eliminarProyecto(${c.id},${p.id})">eliminar</button></div></div></div>`).join(''):'<div class="empty" style="padding:14px 0">Sin proyectos todavía.</div>'}
  <div class="mini-form-row" style="margin-top:12px"><button class="btn btn-ghost btn-sm btn-block" onclick="mostrarFormProyecto(${c.id})">+ Nuevo proyecto</button></div>
  <div class="mini-form" id="form-proy-${c.id}" style="display:none"><input id="pr-concepto-${c.id}" placeholder="Concepto"><div class="mini-form-row"><input type="number" id="pr-monto-${c.id}" placeholder="Monto (S/)"><select id="pr-estado-${c.id}"><option value="pendiente">Pendiente</option><option value="pagado">Ya pagado</option></select></div><button class="btn btn-brass btn-sm" onclick="guardarProyecto(${c.id})">Guardar proyecto</button></div></div>`;
  cont.appendChild(frame);
 });
}

function renderColaboradores(){
 const cont=document.getElementById('lista-colaboradores'),nar=document.getElementById('narrativa-colaboradores');cont.innerHTML='';
 const acreedores=colaboradores.filter(c=>totalDebo(c)>0),total=acreedores.reduce((s,c)=>s+totalDebo(c),0);
 nar.innerHTML=!colaboradores.length?'Todavía no registras a nadie de tu equipo.':!acreedores.length?`Tienes <span class="num">${colaboradores.length}</span> colaborador${colaboradores.length===1?'':'es'} y no le debes nada a nadie.`:`Le debes <span class="num debe">${fmt(total)}</span> a ${acreedores.map(c=>esc(c.nombre)).join(' y ')}.`;
 if(!colaboradores.length){cont.innerHTML='<div class="empty">Aquí aparecerá tu equipo.</div>';return}
 colaboradores.forEach((c,idx)=>{
  c.pagos=c.pagos||[];const deb=totalDebo(c),frame=document.createElement('div');frame.className='frame';frame.id='frame-col-'+c.id;
  frame.innerHTML=`<div class="frame-top" onclick="toggleFrameColab(${c.id})"><div class="iris oxide"><span>${esc(iniciales(c.nombre))}</span></div><div><div class="frame-id">N.${String(idx+1).padStart(2,'0')}${c.rol?' · '+esc(c.rol):''}</div><div class="frame-name">${esc(c.nombre)}</div><div class="frame-meta">${c.pagos.length} pago${c.pagos.length===1?'':'s'} · pagado ${fmt(totalPagadoA(c))}</div></div><div class="frame-right"><span class="estado-pill ${deb?'estado-debe':'estado-al-dia'}">${deb?'debes '+fmt(deb):'al día'}</span></div></div>
  <div class="frame-detail"><div class="actions"><button class="link-btn" onclick="editarColaborador(${c.id})">editar colaborador</button><button class="link-btn danger" onclick="eliminarColaborador(${c.id})">eliminar colaborador</button></div>
  ${c.pagos.length?c.pagos.map(p=>`<div class="detail-row"><div><div class="concepto">${esc(p.concepto)}</div><div class="fecha">${esc(p.fecha)}</div></div><div style="text-align:right"><div class="monto ${p.estado==='pagado'?'pagado':'debe'}">${fmt(p.monto)}</div>${p.estado==='pendiente'?`<button class="link-btn" onclick="marcarPagado(${c.id},${p.id})">marcar pagado</button>`:''}<div class="actions" style="justify-content:flex-end"><button class="link-btn" onclick="editarPago(${c.id},${p.id})">editar</button><button class="link-btn danger" onclick="eliminarPago(${c.id},${p.id})">eliminar</button></div></div></div>`).join(''):'<div class="empty" style="padding:14px 0">Sin pagos registrados.</div>'}
  <div class="mini-form-row" style="margin-top:12px"><button class="btn btn-ghost btn-sm btn-block" onclick="mostrarFormPago(${c.id})">+ Nuevo pago</button></div>
  <div class="mini-form" id="form-pago-${c.id}" style="display:none"><input id="pg-concepto-${c.id}" placeholder="Concepto"><div class="mini-form-row"><input type="number" id="pg-monto-${c.id}" placeholder="Monto (S/)"><select id="pg-estado-${c.id}"><option value="pendiente">Pendiente</option><option value="pagado">Ya pagado</option></select></div><button class="btn btn-brass btn-sm" onclick="guardarPago(${c.id})">Guardar pago</button></div></div>`;
  cont.appendChild(frame);
 });
}

function renderCobros(){
 const pendientes=todosLosPendientes(),pagos=todosLosPagosPendientes(),nar=document.getElementById('narrativa-cobros');
 nar.innerHTML=!pendientes.length&&!pagos.length?'No tienes cobros ni pagos pendientes. Todo al día.':`${pendientes.length?`Tienes <span class="num pend">${pendientes.length}</span> cobro${pendientes.length===1?'':'s'} por cobrar. `:''}${pagos.length?`Debes <span class="num debe">${pagos.length}</span> pago${pagos.length===1?'':'s'} a tu equipo.`:''}`;
 const cc=document.getElementById('lista-cobros');cc.innerHTML=pendientes.length?'':'<div class="empty">Nadie te debe nada por ahora.</div>';
 pendientes.forEach(({cliente,proyecto})=>{const d=diasDesde(proyecto.fecha),cl=d>=14?'tc-hot':d>=7?'tc-warn':'tc-fresh';cc.insertAdjacentHTML('beforeend',`<div class="cobro-row"><div class="cobro-left"><div class="cliente">${esc(cliente.nombre)}</div><div class="concepto">${esc(proyecto.concepto)}</div></div><div class="cobro-mid"><span class="timecode ${cl}">+${String(d).padStart(2,'0')}d</span></div><div class="cobro-right"><div class="cobro-monto">${fmt(proyecto.monto)}</div><button class="link-btn" onclick="marcarCobrado(${cliente.id},${proyecto.id})">marcar cobrado</button><div class="actions"><button class="link-btn" onclick="editarProyecto(${cliente.id},${proyecto.id})">editar</button><button class="link-btn danger" onclick="eliminarProyecto(${cliente.id},${proyecto.id})">eliminar</button></div></div></div>`)});
 const cp=document.getElementById('lista-pagos');cp.innerHTML=pagos.length?'':'<div class="empty">No le debes nada a tu equipo por ahora.</div>';
 pagos.forEach(({colaborador,pago})=>{const d=diasDesde(pago.fecha),cl=d>=14?'tc-hot':d>=7?'tc-warn':'tc-fresh';cp.insertAdjacentHTML('beforeend',`<div class="cobro-row"><div class="cobro-left"><div class="cliente">${esc(colaborador.nombre)}</div><div class="concepto">${esc(pago.concepto)}</div></div><div class="cobro-mid"><span class="timecode ${cl}">+${String(d).padStart(2,'0')}d</span></div><div class="cobro-right"><div class="cobro-monto">${fmt(pago.monto)}</div><button class="link-btn" onclick="marcarPagado(${colaborador.id},${pago.id})">marcar pagado</button><div class="actions"><button class="link-btn" onclick="editarPago(${colaborador.id},${pago.id})">editar</button><button class="link-btn danger" onclick="eliminarPago(${colaborador.id},${pago.id})">eliminar</button></div></div></div>`)});
}

function renderEquipo(){
 const nar=document.getElementById('narrativa-equipo'),cont=document.getElementById('lista-equipo'),total=totalEquipoInvertido();cont.innerHTML='';
 nar.innerHTML=!equipo.length?'Todavía no registras equipos. Añade cámaras, lentes, luces o cualquier otra inversión.':`Tienes <span class="num">${fmt(total)}</span> invertidos en ${equipo.length} equipo${equipo.length===1?'':'s'}.`;
 if(!equipo.length){cont.innerHTML='<div class="empty">Sin equipos registrados todavía.</div>';return}
 const cats={};equipo.forEach(e=>(cats[e.categoria]=cats[e.categoria]||[]).push(e));
 Object.entries(cats).forEach(([cat,items])=>{cont.insertAdjacentHTML('beforeend',`<div class="section-title">${esc(cat)} · ${fmt(items.reduce((s,e)=>s+Number(e.monto||0),0))}</div>`);items.forEach(e=>cont.insertAdjacentHTML('beforeend',`<div class="equipo-row"><div><div class="nombre">${esc(e.nombre)}</div><div class="fecha">${esc(e.fecha||'')}</div></div><div style="text-align:right"><div class="monto">${fmt(e.monto)}</div><div class="actions" style="justify-content:flex-end"><button class="link-btn" onclick="editarEquipo(${e.id})">editar</button><button class="link-btn danger" onclick="eliminarEquipo(${e.id})">eliminar</button></div></div></div>`))});
}

function renderResumen(){
 const mes=mesActual(),cobrado=clientes.flatMap(c=>c.proyectos||[]).filter(p=>p.estado==='pagado'&&String(p.fecha||'').startsWith(mes)).reduce((s,p)=>s+Number(p.monto||0),0),pend=clientes.reduce((s,c)=>s+totalPendiente(c),0),debes=colaboradores.reduce((s,c)=>s+totalDebo(c),0),gear=totalEquipoInvertido(),bal=cobrado+pend-debes;
 document.getElementById('st-cobrado').textContent=fmt(cobrado);document.getElementById('st-pendiente').textContent=fmt(pend);document.getElementById('st-debes').textContent=fmt(debes);document.getElementById('st-equipo').textContent=fmt(gear);
 document.getElementById('narrativa-resumen').innerHTML=`Este mes cobraste <span class="num">${fmt(cobrado)}</span>. Te falta cobrar <span class="num pend">${fmt(pend)}</span> y debes <span class="num debe">${fmt(debes)}</span>. Si cobras y pagas todo, quedarías en <span class="num">${fmt(bal)}</span>.`;
 const cont=document.getElementById('lista-breakdown');cont.innerHTML=clientes.length?'':'<div class="empty">Sin datos todavía.</div>';
 clientes.slice().sort((a,b)=>totalFacturado(b)-totalFacturado(a)).forEach(c=>{const p=totalPendiente(c);cont.insertAdjacentHTML('beforeend',`<div class="cobro-row"><div class="cobro-left"><div class="cliente">${esc(c.nombre)}</div><div class="concepto">${(c.proyectos||[]).length} proyecto${(c.proyectos||[]).length===1?'':'s'}</div></div><div class="cobro-right"><div class="cobro-monto">${fmt(totalFacturado(c))}</div><span class="estado-pill ${p?'estado-pendiente':'estado-al-dia'}">${p?'debe '+fmt(p):'al día'}</span></div></div>`)});
}

function renderAll(){renderClientes();renderColaboradores();renderCobros();renderEquipo();renderResumen()}
renderAll();

if('serviceWorker' in navigator && location.protocol!=='file:'){
 window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));
}
</script>
</body>
</html>
