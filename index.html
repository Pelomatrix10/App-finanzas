<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mis Finanzas — Estudio</title>
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<meta name="theme-color" content="#17140f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Anton&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink: #17140f;
    --ink-2: #201c15;
    --paper: #f2ead9;
    --paper-dim: #cbc0a8;
    --brass: #c69a52;
    --brass-soft: rgba(198,154,82,.16);
    --moss: #8a9a7e;
    --moss-bg: rgba(138,154,126,.14);
    --terracotta: #b5602f;
    --terracotta-bg: rgba(181,96,47,.16);
    --oxide: #a23c26;
    --oxide-bg: rgba(162,60,38,.18);
    --line: rgba(242,234,217,.14);
  }
  *{box-sizing:border-box;}
  html,body{margin:0; padding:0;}
  body{
    background:var(--ink);
    color:var(--paper);
    font-family:'Inter',sans-serif;
    display:flex;
    justify-content:center;
  }
  .app{
    width:100%;
    max-width:460px;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    background:
      radial-gradient(1200px 400px at 50% -10%, rgba(198,154,82,.10), transparent),
      var(--ink);
  }

  header{
    padding:30px 22px 16px 22px;
    border-bottom:1px solid var(--line);
  }
  .eyebrow{
    font-family:'Bebas Neue', sans-serif;
    font-size:14px;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:var(--brass);
    margin-bottom:6px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--brass); display:inline-block;}
  header h1{
    font-family:'Anton', sans-serif;
    font-weight:400;
    font-size:32px;
    margin:0 0 6px 0;
    letter-spacing:-.01em;
    text-transform:uppercase;
    line-height:.95;
  }
  header p.sub{ margin:0; font-size:13px; color:var(--paper-dim); line-height:1.5; }

  nav.tabs{
    display:flex; padding:0 8px; border-bottom:1px solid var(--line); gap:2px;
    overflow-x:auto; scrollbar-width:none;
  }
  nav.tabs::-webkit-scrollbar{ display:none; }
  nav.tabs button{
    flex:1; min-width:74px; background:none; border:none; color:var(--paper-dim);
    font-family:'Bebas Neue', sans-serif; font-size:14px; letter-spacing:.05em; text-transform:uppercase;
    padding:14px 4px 11px 4px; cursor:pointer; border-bottom:2px solid transparent;
    transition:color .15s ease, border-color .15s ease; white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis;
  }
  nav.tabs button.active{ color:var(--paper); border-color:var(--brass); }

  main{ padding:20px 18px 60px 18px; flex:1; }
  section{ display:none; }
  section.active{ display:block; }

  .narrativa{
    font-family:'Inter', sans-serif; font-weight:500; font-size:15px; line-height:1.6;
    color:var(--paper); padding:16px 4px 20px 4px; border-bottom:1px solid var(--line); margin-bottom:18px;
  }
  .narrativa .num{ font-family:'Bebas Neue', sans-serif; font-size:1.25em; letter-spacing:.03em; color:var(--brass); }
  .narrativa .num.pend{ color:var(--terracotta); }
  .narrativa .num.debe{ color:var(--oxide); }

  .btn{
    font-family:'Bebas Neue',sans-serif; font-size:15px; letter-spacing:.03em;
    border-radius:9px; padding:11px 16px; border:1px solid transparent; cursor:pointer;
  }
  .btn-brass{ background:var(--brass); color:var(--ink); }
  .btn-ghost{ background:transparent; color:var(--paper); border-color:var(--line); }
  .btn-block{ width:100%; }
  .btn-sm{ padding:8px 12px; font-size:13px; border-radius:7px; }

  .add-row{ display:flex; justify-content:flex-end; margin-bottom:16px; }

  .filmstrip{ position:relative; }
  .frame{
    position:relative; background:var(--ink-2); border:1px solid var(--line); border-radius:4px;
    margin-bottom:14px; padding:16px 16px 16px 22px; cursor:pointer; overflow:hidden;
  }
  .frame::before, .frame::after{
    content:''; position:absolute; left:0; top:0; bottom:0; width:8px;
    background-image: radial-gradient(circle, var(--ink) 2.2px, transparent 2.3px);
    background-size: 8px 14px; background-position: 0 4px; opacity:.9;
  }
  .frame::after{ left:auto; right:0; }
  .frame-top{ display:flex; align-items:center; gap:12px; }

  .iris{
    width:44px; height:44px; border-radius:50%; flex:none;
    background:
      conic-gradient(from 0deg,
        var(--brass) 0 40deg, transparent 40deg 45deg,
        var(--brass) 45deg 85deg, transparent 85deg 90deg,
        var(--brass) 90deg 130deg, transparent 130deg 135deg,
        var(--brass) 135deg 175deg, transparent 175deg 180deg,
        var(--brass) 180deg 220deg, transparent 220deg 225deg,
        var(--brass) 225deg 265deg, transparent 265deg 270deg,
        var(--brass) 270deg 310deg, transparent 310deg 315deg,
        var(--brass) 315deg 355deg, transparent 355deg 360deg);
    display:flex; align-items:center; justify-content:center; position:relative;
  }
  .iris.oxide{
    background:
      conic-gradient(from 0deg,
        var(--oxide) 0 40deg, transparent 40deg 45deg,
        var(--oxide) 45deg 85deg, transparent 85deg 90deg,
        var(--oxide) 90deg 130deg, transparent 130deg 135deg,
        var(--oxide) 135deg 175deg, transparent 175deg 180deg,
        var(--oxide) 180deg 220deg, transparent 220deg 225deg,
        var(--oxide) 225deg 265deg, transparent 265deg 270deg,
        var(--oxide) 270deg 310deg, transparent 310deg 315deg,
        var(--oxide) 315deg 355deg, transparent 355deg 360deg);
  }
  .iris span{
    position:relative; z-index:2; width:26px; height:26px; border-radius:50%; background:var(--ink-2);
    display:flex; align-items:center; justify-content:center;
    font-family:'Bebas Neue', sans-serif; font-weight:400; font-size:15px; color:var(--paper);
  }

  .frame-id{ font-family:'IBM Plex Mono', monospace; font-size:10.5px; letter-spacing:.08em; color:var(--paper-dim); margin-bottom:2px; }
  .frame-name{ font-family:'Bebas Neue', sans-serif; font-weight:400; font-size:22px; letter-spacing:.02em; }
  .frame-meta{ font-size:12px; color:var(--paper-dim); margin-top:2px; }

  .frame-right{ margin-left:auto; text-align:right; }
  .estado-pill{
    font-family:'Bebas Neue', sans-serif; font-size:13px; letter-spacing:.03em;
    padding:4px 10px; border-radius:20px; display:inline-block; white-space:nowrap;
  }
  .estado-al-dia{ background:var(--moss-bg); color:var(--moss); }
  .estado-pendiente{ background:var(--terracotta-bg); color:var(--terracotta); }
  .estado-debe{ background:var(--oxide-bg); color:var(--oxide); }

  .frame-detail{ margin-top:14px; padding-top:14px; border-top:1px dashed var(--line); display:none; }
  .frame.open .frame-detail{ display:block; }

  .detail-row{
    display:flex; justify-content:space-between; align-items:center;
    padding:8px 0; border-bottom:1px solid var(--line); font-size:13px;
  }
  .detail-row:last-of-type{ border-bottom:none; }
  .detail-row .concepto{ font-weight:600; }
  .detail-row .fecha{ font-size:11px; color:var(--paper-dim); font-family:'IBM Plex Mono',monospace; }
  .detail-row .monto{ font-family:'IBM Plex Mono', monospace; font-weight:600; }
  .monto.pagado{ color:var(--moss); }
  .monto.pendiente{ color:var(--terracotta); }
  .monto.debe{ color:var(--oxide); }

  .notes{ margin-top:12px; font-size:12.5px; color:var(--paper-dim); font-style:italic; }

  .mini-form{ margin-top:14px; display:grid; gap:8px; }
  .mini-form input, .mini-form select{
    width:100%; background:var(--ink); border:1px solid var(--line); color:var(--paper);
    padding:10px 12px; border-radius:8px; font-size:13.5px; font-family:'Inter',sans-serif;
  }
  .mini-form-row{ display:flex; gap:8px; }

  .cobro-row{
    background:var(--ink-2); border:1px solid var(--line); border-radius:10px;
    padding:14px 16px; margin-bottom:12px; display:flex; justify-content:space-between; align-items:center; gap:10px;
  }
  .cobro-left .cliente{ font-family:'Bebas Neue', sans-serif; font-weight:400; font-size:19px; letter-spacing:.02em; }
  .cobro-left .concepto{ font-size:12.5px; color:var(--paper-dim); margin-top:2px; }
  .cobro-mid{ text-align:center; }
  .timecode{ font-family:'IBM Plex Mono', monospace; font-weight:600; font-size:13px; padding:4px 9px; border-radius:6px; }
  .tc-fresh{ background:var(--brass-soft); color:var(--brass); }
  .tc-warn{ background:var(--terracotta-bg); color:var(--terracotta); }
  .tc-hot{ background:var(--oxide-bg); color:var(--oxide); }
  .cobro-right{ display:flex; flex-direction:column; gap:6px; align-items:flex-end; }
  .cobro-monto{ font-family:'Bebas Neue', sans-serif; font-weight:400; font-size:19px; letter-spacing:.02em; }
  .cobrado-link{
    font-family:'Inter',sans-serif; font-size:11px; color:var(--paper-dim);
    background:none; border:none; cursor:pointer; text-decoration:underline; padding:0;
  }

  .section-title{
    font-family:'Bebas Neue', sans-serif; font-size:16px; letter-spacing:.06em; text-transform:uppercase;
    color:var(--paper-dim); margin:22px 2px 10px 2px;
  }
  .section-title:first-child{ margin-top:0; }

  .stat-grid{ display:flex; gap:8px; margin-bottom:22px; flex-wrap:wrap; }
  .stat{
    flex:1; min-width:100px; background:var(--ink-2); border:1px solid var(--line); border-radius:10px;
    padding:14px; text-align:center;
  }
  .stat .label{ font-family:'IBM Plex Mono', monospace; font-size:9px; letter-spacing:.06em; text-transform:uppercase; color:var(--paper-dim); margin-bottom:6px; }
  .stat .value{ font-family:'Anton', sans-serif; font-weight:400; font-size:18px; }
  .value.moss{ color:var(--moss); } .value.brass{ color:var(--brass); }
  .value.terracotta{ color:var(--terracotta); } .value.oxide{ color:var(--oxide); }

  .breakdown-title{
    font-family:'IBM Plex Mono', monospace; font-size:10.5px; letter-spacing:.08em; text-transform:uppercase;
    color:var(--paper-dim); margin:0 0 10px 2px;
  }
  .empty{ color:var(--paper-dim); font-size:13px; text-align:center; padding:30px 0; font-style:italic; }

  .equipo-row{
    background:var(--ink-2); border:1px solid var(--line); border-radius:10px;
    padding:13px 16px; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center;
  }
  .equipo-row .nombre{ font-weight:600; font-size:14.5px; }
  .equipo-row .fecha{ font-size:11px; color:var(--paper-dim); margin-top:2px; }
  .equipo-row .monto{ font-family:'Bebas Neue', sans-serif; font-size:18px; letter-spacing:.02em; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="eyebrow"><span class="dot"></span> Mis Finanzas</div>
    <h1>Todo tu estudio</h1>
    <p class="sub">Quién te debe, a quién le debes, y cuánto tienes invertido.</p>
  </header>

  <nav class="tabs">
    <button class="tab-btn active" data-tab="clientes">Clientes</button>
    <button class="tab-btn" data-tab="colaboradores">Equipo</button>
    <button class="tab-btn" data-tab="cobros">Pagos</button>
    <button class="tab-btn" data-tab="equipo">Gear</button>
    <button class="tab-btn" data-tab="resumen">Resumen</button>
  </nav>

  <main>
    <section id="tab-clientes" class="active">
      <div class="narrativa" id="narrativa-clientes"></div>
      <div class="add-row"><button class="btn btn-brass btn-sm" id="btn-nuevo-cliente">+ Nuevo cliente</button></div>
      <div class="mini-form" id="form-nuevo-cliente" style="display:none; margin-bottom:18px;">
        <input type="text" id="nc-nombre" placeholder="Nombre del cliente">
        <input type="text" id="nc-nota" placeholder="Nota (opcional): estilo, preferencias...">
        <div class="mini-form-row">
          <button class="btn btn-brass btn-block btn-sm" onclick="guardarCliente()">Guardar</button>
          <button class="btn btn-ghost btn-block btn-sm" onclick="toggleFormCliente(false)">Cancelar</button>
        </div>
      </div>
      <div class="filmstrip" id="lista-clientes"></div>
    </section>

    <section id="tab-colaboradores">
      <div class="narrativa" id="narrativa-colaboradores"></div>
      <div class="add-row"><button class="btn btn-brass btn-sm" id="btn-nuevo-colab">+ Nuevo colaborador</button></div>
      <div class="mini-form" id="form-nuevo-colab" style="display:none; margin-bottom:18px;">
        <input type="text" id="col-nombre" placeholder="Nombre">
        <input type="text" id="col-rol" placeholder="Rol (ej. Editor, Asistente, Luminotécnico, Diseñador)">
        <div class="mini-form-row">
          <button class="btn btn-brass btn-block btn-sm" onclick="guardarColaborador()">Guardar</button>
          <button class="btn btn-ghost btn-block btn-sm" onclick="toggleFormColab(false)">Cancelar</button>
        </div>
      </div>
      <div class="filmstrip" id="lista-colaboradores"></div>
    </section>

    <section id="tab-cobros">
      <div class="narrativa" id="narrativa-cobros"></div>
      <div class="section-title">Te deben</div>
      <div id="lista-cobros"></div>
      <div class="section-title">Debes</div>
      <div id="lista-pagos"></div>
    </section>

    <section id="tab-equipo">
      <div class="narrativa" id="narrativa-equipo"></div>
      <div class="add-row"><button class="btn btn-brass btn-sm" id="btn-nuevo-equipo">+ Nuevo equipo</button></div>
      <div class="mini-form" id="form-nuevo-equipo" style="display:none; margin-bottom:18px;">
        <input type="text" id="eq-nombre" placeholder="Nombre (ej. Sony A7IV)">
        <select id="eq-categoria">
          <option value="Cámaras">Cámaras</option>
          <option value="Lentes">Lentes</option>
          <option value="Iluminación">Iluminación</option>
          <option value="Audio">Audio</option>
          <option value="Otros">Otros</option>
        </select>
        <input type="number" id="eq-monto" placeholder="Monto invertido (S/)">
        <div class="mini-form-row">
          <button class="btn btn-brass btn-block btn-sm" onclick="guardarEquipo()">Guardar</button>
          <button class="btn btn-ghost btn-block btn-sm" onclick="toggleFormEquipo(false)">Cancelar</button>
        </div>
      </div>
      <div id="lista-equipo"></div>
    </section>

    <section id="tab-resumen">
      <div class="narrativa" id="narrativa-resumen"></div>
      <div class="stat-grid">
        <div class="stat"><div class="label">Cobrado / mes</div><div class="value moss" id="st-cobrado">S/ 0</div></div>
        <div class="stat"><div class="label">Te deben</div><div class="value terracotta" id="st-pendiente">S/ 0</div></div>
        <div class="stat"><div class="label">Debes</div><div class="value oxide" id="st-debes">S/ 0</div></div>
        <div class="stat"><div class="label">En equipo</div><div class="value brass" id="st-equipo">S/ 0</div></div>
      </div>
      <div class="breakdown-title">Por cliente</div>
      <div id="lista-breakdown"></div>
    </section>
  </main>
</div>

<script>
const STORAGE_KEY = 'estudio_app_completa_v1';

function seed(){
  return {
    clientes: [
      { id: 1, nombre: 'Camila', nota: 'Prefiere edición cálida, tono cinematográfico.',
        proyectos: [ { id: 1, concepto: 'Jacinta', monto: 2500, estado: 'pendiente', fecha: '2026-08-26' } ] },
      { id: 2, nombre: 'Martín', nota: '',
        proyectos: [ { id: 2, concepto: 'Hipermercado Cerámico', monto: 1500, estado: 'pagado', fecha: '2026-08-25' } ] }
    ],
    colaboradores: [
      { id: 1, nombre: 'Renzo', rol: 'Editor de video',
        pagos: [ { id: 1, concepto: 'Edición boda Sofía', monto: 800, estado: 'pendiente', fecha: '2026-08-20' } ] },
      { id: 2, nombre: 'Valeria', rol: 'Asistente de cámara',
        pagos: [ { id: 2, concepto: 'Jornada Hipermercado Cerámico', monto: 300, estado: 'pagado', fecha: '2026-08-25' } ] }
    ],
    equipo: [
      { id: 1, nombre: 'Sony A7 IV', categoria: 'Cámaras', monto: 8500, fecha: '2025-11-02' },
      { id: 2, nombre: 'Lente 24-70mm f/2.8', categoria: 'Lentes', monto: 3200, fecha: '2025-11-15' },
      { id: 3, nombre: 'Kit de luces Aputure', categoria: 'Iluminación', monto: 2600, fecha: '2026-02-10' }
    ]
  };
}

let data = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null') || seed();
let clientes = data.clientes, colaboradores = data.colaboradores, equipo = data.equipo;

let nextClienteId = Math.max(0, ...clientes.map(c=>c.id)) + 1;
let nextProyectoId = Math.max(0, ...clientes.flatMap(c=>c.proyectos.map(p=>p.id))) + 1;
let nextColabId = Math.max(0, ...colaboradores.map(c=>c.id)) + 1;
let nextPagoId = Math.max(0, ...colaboradores.flatMap(c=>c.pagos.map(p=>p.id))) + 1;
let nextEquipoId = Math.max(0, ...equipo.map(e=>e.id)) + 1;

function guardar(){ localStorage.setItem(STORAGE_KEY, JSON.stringify({ clientes, colaboradores, equipo })); }

const fmt = n => 'S/ ' + n.toLocaleString('es-PE', {minimumFractionDigits:0, maximumFractionDigits:0});
const hoy = () => new Date().toISOString().slice(0,10);
function diasDesde(fechaISO){
  const ms = new Date(hoy()) - new Date(fechaISO);
  return Math.max(0, Math.floor(ms / 86400000));
}
function mesActual(){ return hoy().slice(0,7); }
function iniciales(nombre){ return nombre.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase(); }

function totalPendiente(c){ return c.proyectos.filter(p=>p.estado==='pendiente').reduce((s,p)=>s+p.monto,0); }
function totalFacturado(c){ return c.proyectos.reduce((s,p)=>s+p.monto,0); }
function todosLosPendientes(){
  const out = [];
  clientes.forEach(c => c.proyectos.forEach(p => { if(p.estado==='pendiente') out.push({ cliente: c, proyecto: p }); }));
  return out.sort((a,b)=> diasDesde(b.proyecto.fecha) - diasDesde(a.proyecto.fecha));
}

function totalDebo(c){ return c.pagos.filter(p=>p.estado==='pendiente').reduce((s,p)=>s+p.monto,0); }
function totalPagadoA(c){ return c.pagos.reduce((s,p)=>s+p.monto,0); }
function todosLosPagosPendientes(){
  const out = [];
  colaboradores.forEach(c => c.pagos.forEach(p => { if(p.estado==='pendiente') out.push({ colaborador: c, pago: p }); }));
  return out.sort((a,b)=> diasDesde(b.pago.fecha) - diasDesde(a.pago.fecha));
}

function totalEquipoInvertido(){ return equipo.reduce((s,e)=>s+e.monto,0); }

document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('main > section').forEach(s=>s.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-'+btn.dataset.tab).classList.add('active');
    renderAll();
  });
});

function toggleFrame(id){ document.getElementById('frame-'+id).classList.toggle('open'); }
window.toggleFrame = toggleFrame;
function toggleFrameColab(id){ document.getElementById('frame-col-'+id).classList.toggle('open'); }
window.toggleFrameColab = toggleFrameColab;

function toggleFormCliente(show){ document.getElementById('form-nuevo-cliente').style.display = show ? 'grid' : 'none'; }
document.getElementById('btn-nuevo-cliente').addEventListener('click', ()=>toggleFormCliente(true));

function guardarCliente(){
  const nombre = document.getElementById('nc-nombre').value.trim();
  const nota = document.getElementById('nc-nota').value.trim();
  if(!nombre){ alert('Ponle un nombre al cliente.'); return; }
  clientes.push({ id: nextClienteId++, nombre, nota, proyectos: [] });
  guardar();
  document.getElementById('nc-nombre').value=''; document.getElementById('nc-nota').value='';
  toggleFormCliente(false);
  renderAll();
}
window.guardarCliente = guardarCliente;

function mostrarFormProyecto(clienteId){
  const el = document.getElementById('form-proy-'+clienteId);
  el.style.display = el.style.display === 'grid' ? 'none' : 'grid';
}
window.mostrarFormProyecto = mostrarFormProyecto;

function guardarProyecto(clienteId){
  const c = clientes.find(cl=>cl.id===clienteId);
  const concepto = document.getElementById(`pr-concepto-${clienteId}`).value.trim();
  const monto = parseFloat(document.getElementById(`pr-monto-${clienteId}`).value);
  const estado = document.getElementById(`pr-estado-${clienteId}`).value;
  if(!concepto || !monto){ alert('Completa el concepto y el monto.'); return; }
  c.proyectos.unshift({ id: nextProyectoId++, concepto, monto, estado, fecha: hoy() });
  guardar(); renderAll();
}
window.guardarProyecto = guardarProyecto;

function marcarCobrado(clienteId, proyectoId){
  const c = clientes.find(cl=>cl.id===clienteId);
  const p = c.proyectos.find(pr=>pr.id===proyectoId);
  p.estado = 'pagado'; p.fecha = hoy();
  guardar(); renderAll();
}
window.marcarCobrado = marcarCobrado;

function toggleFormColab(show){ document.getElementById('form-nuevo-colab').style.display = show ? 'grid' : 'none'; }
document.getElementById('btn-nuevo-colab').addEventListener('click', ()=>toggleFormColab(true));

function guardarColaborador(){
  const nombre = document.getElementById('col-nombre').value.trim();
  const rol = document.getElementById('col-rol').value.trim();
  if(!nombre){ alert('Ponle un nombre al colaborador.'); return; }
  colaboradores.push({ id: nextColabId++, nombre, rol, pagos: [] });
  guardar();
  document.getElementById('col-nombre').value=''; document.getElementById('col-rol').value='';
  toggleFormColab(false);
  renderAll();
}
window.guardarColaborador = guardarColaborador;

function mostrarFormPago(colabId){
  const el = document.getElementById('form-pago-'+colabId);
  el.style.display = el.style.display === 'grid' ? 'none' : 'grid';
}
window.mostrarFormPago = mostrarFormPago;

function guardarPago(colabId){
  const c = colaboradores.find(cl=>cl.id===colabId);
  const concepto = document.getElementById(`pg-concepto-${colabId}`).value.trim();
  const monto = parseFloat(document.getElementById(`pg-monto-${colabId}`).value);
  const estado = document.getElementById(`pg-estado-${colabId}`).value;
  if(!concepto || !monto){ alert('Completa el concepto y el monto.'); return; }
  c.pagos.unshift({ id: nextPagoId++, concepto, monto, estado, fecha: hoy() });
  guardar(); renderAll();
}
window.guardarPago = guardarPago;

function marcarPagado(colabId, pagoId){
  const c = colaboradores.find(cl=>cl.id===colabId);
  const p = c.pagos.find(pg=>pg.id===pagoId);
  p.estado = 'pagado'; p.fecha = hoy();
  guardar(); renderAll();
}
window.marcarPagado = marcarPagado;

function toggleFormEquipo(show){ document.getElementById('form-nuevo-equipo').style.display = show ? 'grid' : 'none'; }
document.getElementById('btn-nuevo-equipo').addEventListener('click', ()=>toggleFormEquipo(true));

function guardarEquipo(){
  const nombre = document.getElementById('eq-nombre').value.trim();
  const categoria = document.getElementById('eq-categoria').value;
  const monto = parseFloat(document.getElementById('eq-monto').value);
  if(!nombre || !monto){ alert('Completa el nombre y el monto.'); return; }
  equipo.unshift({ id: nextEquipoId++, nombre, categoria, monto, fecha: hoy() });
  guardar();
  document.getElementById('eq-nombre').value=''; document.getElementById('eq-monto').value='';
  toggleFormEquipo(false);
  renderAll();
}
window.guardarEquipo = guardarEquipo;

function renderClientes(){
  const cont = document.getElementById('lista-clientes');
  cont.innerHTML = '';
  const totalPend = clientes.reduce((s,c)=>s+totalPendiente(c),0);
  const deudores = clientes.filter(c=>totalPendiente(c)>0);
  const nar = document.getElementById('narrativa-clientes');
  if(clientes.length===0){
    nar.innerHTML = 'Todavía no registras clientes. Añade el primero para empezar a ver quién te debe qué.';
  } else if(deudores.length===0){
    nar.innerHTML = `Tienes <span class="num">${clientes.length}</span> cliente${clientes.length===1?'':'s'} registrado${clientes.length===1?'':'s'} y nadie te debe nada ahora mismo. Todo al día.`;
  } else {
    const nombres = deudores.map(c=>c.nombre).join(' y ');
    nar.innerHTML = `${nombres} te debe${deudores.length===1?'':'n'} en total <span class="num pend">${fmt(totalPend)}</span>. El resto está al día.`;
  }
  if(clientes.length===0){ cont.innerHTML = '<div class="empty">Aquí aparecerán tus clientes, como fotogramas en una tira de negativos.</div>'; return; }

  clientes.forEach((c, idx)=>{
    const pend = totalPendiente(c);
    const facturado = totalFacturado(c);
    const frame = document.createElement('div');
    frame.className = 'frame'; frame.id = 'frame-'+c.id;
    frame.innerHTML = `
      <div class="frame-top" onclick="toggleFrame(${c.id})">
        <div class="iris"><span>${iniciales(c.nombre)}</span></div>
        <div>
          <div class="frame-id">N.${String(idx+1).padStart(2,'0')}</div>
          <div class="frame-name">${c.nombre}</div>
          <div class="frame-meta">${c.proyectos.length} proyecto${c.proyectos.length===1?'':'s'} · facturado ${fmt(facturado)}</div>
        </div>
        <div class="frame-right">
          <span class="estado-pill ${pend>0 ? 'estado-pendiente' : 'estado-al-dia'}">${pend>0 ? 'debe '+fmt(pend) : 'al día'}</span>
        </div>
      </div>
      <div class="frame-detail">
        ${c.nota ? `<div class="notes">"${c.nota}"</div>` : ''}
        ${c.proyectos.length===0 ? '<div class="empty" style="padding:14px 0;">Sin proyectos todavía.</div>' :
          c.proyectos.map(p => `
            <div class="detail-row">
              <div><div class="concepto">${p.concepto}</div><div class="fecha">${p.fecha}</div></div>
              <div style="text-align:right;">
                <div class="monto ${p.estado}">${p.estado==='pagado' ? '+' : ''} ${fmt(p.monto)}</div>
                ${p.estado==='pendiente' ? `<button class="cobrado-link" onclick="marcarCobrado(${c.id},${p.id})">marcar cobrado</button>` : ''}
              </div>
            </div>`).join('')}
        <div class="mini-form-row" style="margin-top:12px;">
          <button class="btn btn-ghost btn-sm btn-block" onclick="mostrarFormProyecto(${c.id})">+ Nuevo proyecto</button>
        </div>
        <div class="mini-form" id="form-proy-${c.id}" style="display:none;">
          <input type="text" id="pr-concepto-${c.id}" placeholder="Concepto (ej. Boda Sofía)">
          <div class="mini-form-row">
            <input type="number" id="pr-monto-${c.id}" placeholder="Monto (S/)">
            <select id="pr-estado-${c.id}"><option value="pendiente">Pendiente</option><option value="pagado">Ya pagado</option></select>
          </div>
          <button class="btn btn-brass btn-sm" onclick="guardarProyecto(${c.id})">Guardar proyecto</button>
        </div>
      </div>`;
    cont.appendChild(frame);
  });
}

function renderColaboradores(){
  const cont = document.getElementById('lista-colaboradores');
  cont.innerHTML = '';
  const totalDeb = colaboradores.reduce((s,c)=>s+totalDebo(c),0);
  const acreedores = colaboradores.filter(c=>totalDebo(c)>0);
  const nar = document.getElementById('narrativa-colaboradores');
  if(colaboradores.length===0){
    nar.innerHTML = 'Todavía no registras a nadie de tu equipo. Añade editores, asistentes, luminotécnicos o diseñadores.';
  } else if(acreedores.length===0){
    nar.innerHTML = `Tienes <span class="num">${colaboradores.length}</span> colaborador${colaboradores.length===1?'':'es'} y no le debes nada a nadie ahora mismo.`;
  } else {
    const nombres = acreedores.map(c=>c.nombre).join(' y ');
    nar.innerHTML = `Le debes${acreedores.length===1?'':'n'} en total <span class="num debe">${fmt(totalDeb)}</span> a ${nombres}.`;
  }
  if(colaboradores.length===0){ cont.innerHTML = '<div class="empty">Aquí aparecerá tu equipo: editores, asistentes, luminotécnicos, diseñadores...</div>'; return; }

  colaboradores.forEach((c, idx)=>{
    const deb = totalDebo(c);
    const pagadoTotal = totalPagadoA(c);
    const frame = document.createElement('div');
    frame.className = 'frame'; frame.id = 'frame-col-'+c.id;
    frame.innerHTML = `
      <div class="frame-top" onclick="toggleFrameColab(${c.id})">
        <div class="iris oxide"><span>${iniciales(c.nombre)}</span></div>
        <div>
          <div class="frame-id">N.${String(idx+1).padStart(2,'0')}${c.rol ? ' · '+c.rol : ''}</div>
          <div class="frame-name">${c.nombre}</div>
          <div class="frame-meta">${c.pagos.length} pago${c.pagos.length===1?'':'s'} · pagado ${fmt(pagadoTotal)}</div>
        </div>
        <div class="frame-right">
          <span class="estado-pill ${deb>0 ? 'estado-debe' : 'estado-al-dia'}">${deb>0 ? 'debes '+fmt(deb) : 'al día'}</span>
        </div>
      </div>
      <div class="frame-detail">
        ${c.pagos.length===0 ? '<div class="empty" style="padding:14px 0;">Sin pagos registrados todavía.</div>' :
          c.pagos.map(p => `
            <div class="detail-row">
              <div><div class="concepto">${p.concepto}</div><div class="fecha">${p.fecha}</div></div>
              <div style="text-align:right;">
                <div class="monto ${p.estado==='pagado' ? 'pagado' : 'debe'}">${fmt(p.monto)}</div>
                ${p.estado==='pendiente' ? `<button class="cobrado-link" onclick="marcarPagado(${c.id},${p.id})">marcar pagado</button>` : ''}
              </div>
            </div>`).join('')}
        <div class="mini-form-row" style="margin-top:12px;">
          <button class="btn btn-ghost btn-sm btn-block" onclick="mostrarFormPago(${c.id})">+ Nuevo pago</button>
        </div>
        <div class="mini-form" id="form-pago-${c.id}" style="display:none;">
          <input type="text" id="pg-concepto-${c.id}" placeholder="Concepto (ej. Edición boda Sofía)">
          <div class="mini-form-row">
            <input type="number" id="pg-monto-${c.id}" placeholder="Monto (S/)">
            <select id="pg-estado-${c.id}"><option value="pendiente">Pendiente</option><option value="pagado">Ya pagado</option></select>
          </div>
          <button class="btn btn-brass btn-sm" onclick="guardarPago(${c.id})">Guardar pago</button>
        </div>
      </div>`;
    cont.appendChild(frame);
  });
}

function renderCobros(){
  const pendientes = todosLosPendientes();
  const pagosPend = todosLosPagosPendientes();
  const nar = document.getElementById('narrativa-cobros');

  let frase = '';
  if(pendientes.length===0 && pagosPend.length===0){
    frase = 'No tienes cobros ni pagos pendientes. Todo al día, en ambas direcciones.';
  } else {
    if(pendientes.length>0){
      frase += `Tienes <span class="num pend">${pendientes.length}</span> cobro${pendientes.length===1?'':'s'} pendiente${pendientes.length===1?'':'s'} por cobrar. `;
    }
    if(pagosPend.length>0){
      frase += `Debes <span class="num debe">${pagosPend.length}</span> pago${pagosPend.length===1?'':'s'} a tu equipo.`;
    }
  }
  nar.innerHTML = frase;

  const contCobros = document.getElementById('lista-cobros');
  contCobros.innerHTML = '';
  if(pendientes.length===0){
    contCobros.innerHTML = '<div class="empty">Nadie te debe nada por ahora.</div>';
  } else {
    pendientes.forEach(({cliente, proyecto})=>{
      const dias = diasDesde(proyecto.fecha);
      const tcClass = dias >= 14 ? 'tc-hot' : dias >= 7 ? 'tc-warn' : 'tc-fresh';
      const row = document.createElement('div');
      row.className = 'cobro-row';
      row.innerHTML = `
        <div class="cobro-left"><div class="cliente">${cliente.nombre}</div><div class="concepto">${proyecto.concepto}</div></div>
        <div class="cobro-mid"><span class="timecode ${tcClass}">+${String(dias).padStart(2,'0')}d</span></div>
        <div class="cobro-right">
          <div class="cobro-monto">${fmt(proyecto.monto)}</div>
          <button class="cobrado-link" onclick="marcarCobrado(${cliente.id},${proyecto.id})">marcar cobrado</button>
        </div>`;
      contCobros.appendChild(row);
    });
  }

  const contPagos = document.getElementById('lista-pagos');
  contPagos.innerHTML = '';
  if(pagosPend.length===0){
    contPagos.innerHTML = '<div class="empty">No le debes nada a tu equipo por ahora.</div>';
  } else {
    pagosPend.forEach(({colaborador, pago})=>{
      const dias = diasDesde(pago.fecha);
      const tcClass = dias >= 14 ? 'tc-hot' : dias >= 7 ? 'tc-warn' : 'tc-fresh';
      const row = document.createElement('div');
      row.className = 'cobro-row';
      row.innerHTML = `
        <div class="cobro-left"><div class="cliente">${colaborador.nombre}</div><div class="concepto">${pago.concepto}</div></div>
        <div class="cobro-mid"><span class="timecode ${tcClass}">+${String(dias).padStart(2,'0')}d</span></div>
        <div class="cobro-right">
          <div class="cobro-monto">${fmt(pago.monto)}</div>
          <button class="cobrado-link" onclick="marcarPagado(${colaborador.id},${pago.id})">marcar pagado</button>
        </div>`;
      contPagos.appendChild(row);
    });
  }
}

function renderEquipo(){
  const total = totalEquipoInvertido();
  const nar = document.getElementById('narrativa-equipo');
  nar.innerHTML = equipo.length===0
    ? 'Todavía no registras equipos. Añade cámaras, lentes, luces o cualquier otra inversión de tu estudio.'
    : `Tienes <span class="num">${fmt(total)}</span> invertidos en ${equipo.length} equipo${equipo.length===1?'':'s'}.`;

  const cont = document.getElementById('lista-equipo');
  cont.innerHTML = '';
  if(equipo.length===0){ cont.innerHTML = '<div class="empty">Sin equipos registrados todavía.</div>'; return; }

  const categorias = {};
  equipo.forEach(e => { (categorias[e.categoria] = categorias[e.categoria] || []).push(e); });

  Object.keys(categorias).forEach(cat=>{
    const items = categorias[cat];
    const subtotal = items.reduce((s,e)=>s+e.monto,0);
    const title = document.createElement('div');
    title.className = 'section-title';
    title.textContent = `${cat} · ${fmt(subtotal)}`;
    cont.appendChild(title);
    items.forEach(e=>{
      const row = document.createElement('div');
      row.className = 'equipo-row';
      row.innerHTML = `
        <div><div class="nombre">${e.nombre}</div><div class="fecha">${e.fecha}</div></div>
        <div class="monto">${fmt(e.monto)}</div>`;
      cont.appendChild(row);
    });
  });
}

function renderResumen(){
  const mes = mesActual();
  const cobradoMes = clientes.flatMap(c=>c.proyectos).filter(p=>p.estado==='pagado' && p.fecha.startsWith(mes)).reduce((s,p)=>s+p.monto,0);
  const pendienteTotal = clientes.reduce((s,c)=>s+totalPendiente(c),0);
  const debesTotal = colaboradores.reduce((s,c)=>s+totalDebo(c),0);
  const equipoTotal = totalEquipoInvertido();
  const balanceProyectado = cobradoMes + pendienteTotal - debesTotal;

  document.getElementById('st-cobrado').textContent = fmt(cobradoMes);
  document.getElementById('st-pendiente').textContent = fmt(pendienteTotal);
  document.getElementById('st-debes').textContent = fmt(debesTotal);
  document.getElementById('st-equipo').textContent = fmt(equipoTotal);

  const nar = document.getElementById('narrativa-resumen');
  let frase = `Este mes cobraste <span class="num">${fmt(cobradoMes)}</span>.`;
  const deudores = clientes.filter(c=>totalPendiente(c)>0).sort((a,b)=>totalPendiente(b)-totalPendiente(a));
  if(deudores.length>0){
    const top = deudores.slice(0,2).map(c=>`${c.nombre} (${fmt(totalPendiente(c))})`).join(' y ');
    frase += ` Te falta cobrar <span class="num pend">${fmt(pendienteTotal)}</span>, sobre todo de ${top}.`;
  }
  const acreedores = colaboradores.filter(c=>totalDebo(c)>0).sort((a,b)=>totalDebo(b)-totalDebo(a));
  if(acreedores.length>0){
    const top = acreedores.slice(0,2).map(c=>`${c.nombre} (${fmt(totalDebo(c))})`).join(' y ');
    frase += ` Le debes <span class="num debe">${fmt(debesTotal)}</span> a tu equipo, sobre todo a ${top}.`;
  }
  frase += ` Si cobras todo y pagas todo, terminarías con <span class="num">${fmt(balanceProyectado)}</span>.`;
  if(equipoTotal>0){
    frase += ` Aparte, tienes <span class="num">${fmt(equipoTotal)}</span> invertidos en equipo.`;
  }
  nar.innerHTML = frase;

  const cont = document.getElementById('lista-breakdown');
  cont.innerHTML = '';
  if(clientes.length===0){ cont.innerHTML = '<div class="empty">Sin datos todavía.</div>'; return; }
  clientes.slice().sort((a,b)=>totalFacturado(b)-totalFacturado(a)).forEach(c=>{
    const pend = totalPendiente(c);
    const row = document.createElement('div');
    row.className = 'cobro-row';
    row.innerHTML = `
      <div class="cobro-left"><div class="cliente">${c.nombre}</div><div class="concepto">${c.proyectos.length} proyecto${c.proyectos.length===1?'':'s'}</div></div>
      <div class="cobro-right">
        <div class="cobro-monto">${fmt(totalFacturado(c))}</div>
        ${pend>0 ? `<span class="estado-pill estado-pendiente">debe ${fmt(pend)}</span>` : `<span class="estado-pill estado-al-dia">al día</span>`}
      </div>`;
    cont.appendChild(row);
  });
}

function renderAll(){
  renderClientes();
  renderColaboradores();
  renderCobros();
  renderEquipo();
  renderResumen();
}
renderAll();

if('serviceWorker' in navigator && location.protocol !== 'file:'){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('./service-worker.js').catch(()=>{});
  });
}

</script>
